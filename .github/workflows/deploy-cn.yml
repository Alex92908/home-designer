name: Deploy to Tencent Cloud COS (HK · China accessible)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Checkout ───────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Node setup ─────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ── 3. Install deps ───────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Static export → ./out/ ─────────────────────────────
      - name: Build static export
        run: npm run build:static
        env:
          NEXT_PUBLIC_API_BASE: https://home-designer-lovat.vercel.app

      # ── 5. Install coscmd (Tencent COS CLI) ───────────────────
      - name: Install coscmd
        run: pip install coscmd

      # ── 6. Configure coscmd ───────────────────────────────────
      - name: Configure coscmd
        run: |
          coscmd config \
            -a ${{ secrets.TENCENT_SECRET_ID }} \
            -s ${{ secrets.TENCENT_SECRET_KEY }} \
            -b ${{ secrets.TENCENT_COS_BUCKET }} \
            -r ap-hongkong

      # ── 7. Upload to COS ──────────────────────────────────────
      # coscmd uses Python mimetypes → HTML gets text/html automatically
      - name: Upload static files to COS
        run: coscmd upload -r out/ /

      - name: Done
        run: |
          echo "✅ Deployed!"
          echo "   Website: https://${{ secrets.TENCENT_COS_BUCKET }}.cos-website.ap-hongkong.myqcloud.com"
