name: Deploy to Tencent Cloud COS (HK · China accessible)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Checkout ───────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Node setup ─────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ── 3. Install deps ───────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Static export → ./out/ ─────────────────────────────
      - name: Build static export
        run: npm run build:static
        env:
          NEXT_PUBLIC_API_BASE: https://home-designer-lovat.vercel.app

      # ── 5. Install Tencent COS Python SDK ────────────────────
      - name: Install cos-python-sdk-v5
        run: pip install cos-python-sdk-v5

      # ── 6. Upload with explicit Content-Type per file ─────────
      # coscmd is unreliable with MIME types on Ubuntu;
      # this script uses the official SDK and sets Content-Type explicitly.
      - name: Upload static files to COS
        run: python3 scripts/upload-cos.py
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          TENCENT_COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
          COS_REGION: ap-hongkong
          OUT_DIR: out

      - name: Done
        run: |
          echo "✅ Deployed!"
          echo "   Website: https://${{ secrets.TENCENT_COS_BUCKET }}.cos-website.ap-hongkong.myqcloud.com"
